<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space War — Inner Solar System CIC</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #050a0e;
        color: #7df9ff;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        user-select: none;
      }

      #viewport {
        display: block;
        width: 100%;
        height: 100%;
      }

      #hud-boot {
        position: fixed;
        top: 10px;
        left: 14px;
        padding: 5px 10px;
        border: 1px solid rgba(125, 249, 255, 0.35);
        background: rgba(5, 10, 14, 0.85);
        font-size: 11px;
        letter-spacing: 0.04em;
        pointer-events: none;
        z-index: 10;
      }

      #hud-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 20;
      }

      .cic-topbar {
        position: fixed;
        top: 42px;
        left: 14px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: min(740px, calc(100vw - 28px));
        pointer-events: auto;
      }

      .cic-clock {
        font-size: 11px;
        color: #b5e7ee;
        background: rgba(5, 10, 14, 0.85);
        border: 1px solid rgba(125, 249, 255, 0.22);
        padding: 4px 8px;
        width: fit-content;
      }

      .cic-modes {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .cic-btn,
      .cic-mini-btn,
      .cic-chip,
      .cic-exec-btn {
        font-family: inherit;
        color: #bdf8ff;
        background: rgba(8, 17, 24, 0.9);
        border: 1px solid rgba(125, 249, 255, 0.35);
        cursor: pointer;
        transition: border-color 0.12s, background-color 0.12s;
      }

      .cic-btn {
        padding: 5px 10px;
        font-size: 12px;
      }

      .cic-btn:hover,
      .cic-mini-btn:hover,
      .cic-chip:hover {
        border-color: #7df9ff;
        background: rgba(20, 44, 58, 0.92);
      }

      .cic-btn.active,
      .cic-chip.active {
        background: rgba(24, 68, 86, 0.92);
        border-color: #7df9ff;
        color: #ffffff;
      }

      .cic-mini-btn {
        padding: 2px 7px;
        font-size: 11px;
        margin-left: 4px;
      }

      .cic-mini-btn.active {
        background: rgba(24, 68, 86, 0.92);
        border-color: #7df9ff;
        color: #ffffff;
      }

      .cic-netbar,
      .cic-subbar,
      .cic-speedbar,
      .cic-trackbar {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .cic-speedbar,
      .cic-trackbar {
        font-size: 11px;
        color: #9ad7df;
        padding: 2px 6px;
        border: 1px solid rgba(125, 249, 255, 0.2);
        background: rgba(5, 10, 14, 0.8);
      }

      .cic-orbit-designer {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 7px 9px;
        font-size: 11px;
        background: rgba(5, 12, 18, 0.92);
        border: 1px solid rgba(125, 249, 255, 0.35);
        color: #c8f3f9;
      }

      .orbit-help-line b,
      .orbit-step-line b {
        color: #7df9ff;
      }

      .orbit-step-line {
        font-size: 10px;
        color: #9ad7df;
      }

      .orbit-preset-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px;
      }

      .orbit-preset-row .cic-mini-btn {
        margin-left: 0;
      }

      .orbit-sliders-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(120px, 1fr));
        gap: 8px;
        margin-top: 2px;
      }

      .orbit-slider-item {
        display: flex;
        flex-direction: column;
        gap: 2px;
        font-size: 10px;
        color: #bfeef5;
      }

      .cic-input,
      .cic-select {
        font-family: inherit;
        font-size: 11px;
        color: #d7f9ff;
        background: rgba(5, 10, 14, 0.92);
        border: 1px solid rgba(125, 249, 255, 0.32);
        padding: 2px 6px;
        width: 96px;
      }

      .cic-select {
        width: 78px;
      }

      .cic-hint,
      .cic-status {
        font-size: 11px;
        padding: 5px 8px;
        background: rgba(5, 10, 14, 0.88);
        border: 1px solid rgba(125, 249, 255, 0.25);
        color: #c8f3f9;
      }

      .cic-status {
        border-color: rgba(255, 209, 102, 0.5);
        color: #ffd166;
      }

      .cic-unit-dock {
        position: fixed;
        left: 14px;
        bottom: 14px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-width: 520px;
        pointer-events: auto;
      }

      .cic-chip {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 5px 9px;
        font-size: 11px;
      }

      .chip-id {
        font-weight: 700;
      }

      .chip-meta {
        font-size: 10px;
        color: #96ced6;
      }

      .cic-panel {
        position: fixed;
        right: 14px;
        bottom: 48px;
        width: min(420px, calc(100vw - 28px));
        background: rgba(5, 11, 16, 0.93);
        border: 1px solid rgba(125, 249, 255, 0.4);
        padding: 10px;
        pointer-events: auto;
      }

      .cic-unit-terminal {
        top: 12px;
        bottom: auto;
        width: min(360px, calc(100vw - 28px));
        font-size: 11px;
      }

      .umbra-badge {
        font-size: 10px;
        padding: 1px 6px;
        border: 1px solid #9b8cff;
        color: #c8beff;
        background: rgba(72, 56, 130, 0.35);
      }

      .term-stats {
        display: flex;
        justify-content: space-between;
        color: #b4e9f0;
        margin-bottom: 6px;
      }

      .term-subs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 8px;
      }

      .sub-chip {
        font-size: 10px;
        padding: 1px 5px;
        border: 1px solid rgba(125, 249, 255, 0.25);
      }

      .sub-damaged {
        border-color: #ffb703;
        color: #ffd166;
      }

      .sub-offline {
        border-color: #ff4d4f;
        color: #ff8e8e;
      }

      .term-heat {
        margin-bottom: 8px;
      }

      .term-heat-head {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        margin-bottom: 3px;
        color: #bfeef5;
      }

      .heat-track {
        height: 7px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(125, 249, 255, 0.25);
      }

      .heat-fill {
        height: 100%;
        transition: width 0.1s linear;
      }

      .heat-nominal {
        background: #5ce1e6;
      }

      .heat-warm {
        background: #ffb703;
      }

      .heat-critical {
        background: #ff4d4f;
      }

      .term-toggles {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 5px;
        margin-bottom: 8px;
      }

      .term-toggles .cic-btn {
        font-size: 10px;
        padding: 4px 6px;
      }

      .cic-btn.emcon-on {
        border-color: #9b8cff;
        background: rgba(52, 40, 108, 0.85);
      }

      .cic-btn.ew-on {
        border-color: #d08aff;
        background: rgba(76, 30, 104, 0.85);
      }

      .term-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid rgba(125, 249, 255, 0.15);
      }

      .term-label {
        font-size: 10px;
        color: #9ad7df;
      }

      .term-controls {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
      }

      .cic-slider {
        flex: 1;
        min-width: 90px;
        accent-color: #38f2b2;
      }

      .term-angle {
        min-width: 34px;
        text-align: right;
        color: #38f2b2;
        font-weight: 700;
      }

      .cic-alert {
        font-size: 11px;
        padding: 4px 8px;
        background: rgba(82, 16, 20, 0.9);
        border: 1px solid #ff4d4f;
        color: #ffcccc;
      }

      .cic-fire-panel .cic-mini-btn {
        margin-left: 0;
      }

      .fire-controls-row,
      .fire-targets {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 7px;
      }

      .cic-mini-btn.threat {
        border-color: rgba(255, 138, 76, 0.65);
        color: #ffb88c;
      }

      .fire-actions {
        gap: 8px;
      }

      .cic-drawer {
        left: 14px;
        right: auto;
        top: 192px;
        bottom: auto;
        width: min(450px, calc(100vw - 28px));
        max-height: calc(100vh - 270px);
        overflow-y: auto;
        font-size: 11px;
        z-index: 25;
      }

      .drawer-list,
      .build-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 6px;
      }

      .drawer-card {
        border: 1px solid rgba(125, 249, 255, 0.25);
        background: rgba(8, 18, 26, 0.9);
        padding: 7px 8px;
      }

      .drawer-actions,
      .drawer-escorts {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
        margin-top: 5px;
      }

      .cic-drawer .cic-mini-btn {
        margin-left: 0;
      }

      .wonder-grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 4px;
        margin: 6px 0;
      }

      .wonder-cell {
        text-align: center;
        padding: 3px 0;
        font-size: 10px;
        border: 1px solid rgba(125, 249, 255, 0.25);
        color: #8ab4be;
      }

      .wonder-complete {
        background: rgba(92, 225, 230, 0.25);
        border-color: #5ce1e6;
        color: #ffffff;
        font-weight: 700;
      }

      .wonder-building {
        background: rgba(255, 209, 102, 0.2);
        border-color: #ffd166;
        color: #ffd166;
      }

      .wonder-damaged_halted {
        background: rgba(255, 77, 79, 0.25);
        border-color: #ff4d4f;
        color: #ff9999;
      }

      .build-item-btn {
        text-align: left;
        padding: 4px 8px;
      }

      .panel-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #e2fcff;
      }

      .transfer-cards {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .transfer-card {
        border: 1px solid rgba(125, 249, 255, 0.28);
        background: rgba(9, 19, 27, 0.92);
        padding: 7px 9px;
        cursor: pointer;
        font-size: 11px;
      }

      .transfer-card.selected {
        border-color: #7df9ff;
        background: rgba(17, 44, 58, 0.95);
      }

      .transfer-card.infeasible {
        opacity: 0.58;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        font-weight: 700;
        margin-bottom: 4px;
      }

      .card-metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        color: #bfeef5;
        margin-bottom: 4px;
      }

      .card-bingo {
        font-size: 10px;
        padding: 2px 5px;
        border-radius: 2px;
      }

      .card-bingo.bingo-safe {
        color: #4ade80;
        background: rgba(74, 222, 128, 0.12);
      }

      .card-bingo.bingo-amber {
        color: #ffb703;
        background: rgba(255, 183, 3, 0.15);
      }

      .card-bingo.bingo-red {
        color: #ff6b6b;
        background: rgba(255, 77, 79, 0.18);
      }

      .card-reason {
        margin-top: 4px;
        font-size: 10px;
        color: #ff8e8e;
      }

      .panel-actions {
        margin-top: 9px;
        display: flex;
        justify-content: flex-end;
      }

      .cic-exec-btn {
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 700;
        background: rgba(18, 66, 78, 0.95);
        border-color: #5ce1e6;
      }

      .cic-exec-btn.warn {
        border-color: #ffb703;
        color: #ffd166;
        background: rgba(74, 52, 10, 0.9);
      }

      .cic-exec-btn.danger {
        border-color: #ff4d4f;
        color: #ffb3b3;
        background: rgba(82, 16, 20, 0.92);
      }

      .cic-exec-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .cic-modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(2, 6, 10, 0.72);
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        z-index: 50;
      }

      .cic-modal {
        width: min(440px, calc(100vw - 32px));
        background: #071118;
        border: 1px solid #ff4d4f;
        padding: 16px;
        color: #ffe3e3;
      }

      .modal-title {
        font-size: 14px;
        font-weight: 700;
        color: #ff6b6b;
        margin-bottom: 8px;
      }

      .modal-body {
        font-size: 12px;
        line-height: 1.5;
        margin: 0 0 14px;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      /* Retro CRT post-processing sits strictly between #viewport and #hud-root */
      #viewport.crt-active {
        filter: contrast(1.04) drop-shadow(0 0 2px rgba(92, 225, 230, 0.22));
      }

      #crt-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 15;
        background:
          repeating-linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0) 0px,
            rgba(0, 0, 0, 0) 2px,
            rgba(0, 12, 18, 0.24) 3px
          ),
          radial-gradient(
            circle at center,
            rgba(92, 225, 230, 0) 62%,
            rgba(2, 6, 10, 0.58) 100%
          );
      }

      #crt-overlay.crt-off {
        display: none;
      }

      .cic-lobby-backdrop {
        background: rgba(3, 8, 12, 0.78);
      }

      .cic-lobby-card {
        width: min(520px, calc(100vw - 32px));
        border-color: #5ce1e6;
        color: #d7f9ff;
      }

      .lobby-header {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #7df9ff;
      }

      .lobby-subtitle {
        font-size: 11px;
        color: #93cfd8;
        margin: 4px 0 14px;
      }

      .lobby-section {
        margin-bottom: 12px;
      }

      .lobby-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 5px;
      }

      .lobby-room-input {
        width: 180px;
        margin-top: 5px;
        padding: 5px 8px;
      }

      .lobby-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid rgba(125, 249, 255, 0.2);
      }

      .lobby-toggles {
        display: flex;
        gap: 6px;
      }

      .victory-card {
        border-color: #4ade80;
        color: #e6fff0;
      }

      .victory-title {
        color: #4ade80;
      }

      .victory-stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px 12px;
        font-size: 12px;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="crt-overlay"></div>
    <div id="hud-boot">INITIALIZING CIC...</div>
    <div id="hud-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
